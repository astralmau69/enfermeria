<div class="card">
    <div class="flex justify-between items-center mb-5">
        <h3 class="text-2xl font-semibold m-0">Gestión de Usuarios</h3>
        <p-button label="Nuevo Usuario" icon="pi pi-plus" (onClick)="openDialog()"></p-button>
    </div>

    <!-- Tabla dinámica PrimeNG -->
    <p-table [value]="users()" [paginator]="true" [rows]="10" responsiveLayout="scroll" styleClass="p-datatable-striped"
        [loading]="loading()">
        <ng-template pTemplate="header">
            <tr>
                <th style="width: 80px">Foto</th>
                <th pSortableColumn="usuario">Usuario <p-sortIcon field="usuario"></p-sortIcon></th>
                <th pSortableColumn="nombres">Nombres <p-sortIcon field="nombres"></p-sortIcon></th>
                <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                <th pSortableColumn="rol">Rol <p-sortIcon field="rol"></p-sortIcon></th>
                <th>Acciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
            <tr>
                <td>
                    <p-avatar [image]="user.fotoPerfil ? getPhotoUrl(user.fotoPerfil.idArchivo) : 'img/avatar.png'"
                        shape="circle" size="large">
                    </p-avatar>
                </td>
                <td>{{user.usuario}}</td>
                <td>{{user.nombres}} {{user.primerApellido}}</td>
                <td>{{user.email}}</td>
                <td>
                    <span class="px-2 py-1 rounded text-sm font-medium"
                        [ngClass]="{'bg-blue-100 text-blue-800': user.rol === 'ADMIN', 'bg-green-100 text-green-800': user.rol !== 'ADMIN'}">
                        {{user.rol}}
                    </span>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true"
                            (onClick)="editUser(user)"></p-button>
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
                            (onClick)="deleteUser(user)"></p-button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center py-4">No se encontraron usuarios.</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Modal de Formulario -->
    <p-dialog [(visible)]="displayDialog" [header]="dialogTitle" [modal]="true" [style]="{width: '600px'}"
        styleClass="p-fluid">
        <ng-template pTemplate="content">
            <div class="flex flex-col md:flex-row gap-6 mt-2">
                <!-- Sección de Foto -->
                <div class="flex flex-col items-center gap-4 w-full md:w-40">
                    <label class="font-medium">Foto de Perfil</label>
                    <div class="relative group">
                        <p-avatar [image]="previewUrl || 'img/avatar.png'" shape="circle"
                            styleClass="w-32 h-32 border-2 border-surface-200 shadow-sm" size="xlarge">
                        </p-avatar>
                        <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-full opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
                            (click)="fileInput.click()">
                            <i class="pi pi-camera text-white text-2xl"></i>
                        </div>
                    </div>
                    <input #fileInput type="file" (change)="onPhotoSelected($event)" accept="image/*" class="hidden">
                    <p-button *ngIf="isUploading" label="Subiendo..." [disabled]="true" [text]="true"
                        size="small"></p-button>
                </div>

                <!-- Formulario -->
                <form [formGroup]="userForm" class="flex-1 grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-2 col-span-2">
                        <label for="usuario" class="font-medium">Nombre de Usuario (Login)</label>
                        <input pInputText id="usuario" formControlName="usuario" placeholder="Ej: dfloresr"
                            [readonly]="isEditing" />
                        <small class="text-red-500"
                            *ngIf="userForm.get('usuario')?.invalid && userForm.get('usuario')?.touched">El usuario es
                            requerido.</small>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="nombres" class="font-medium">Nombres</label>
                        <input pInputText id="nombres" formControlName="nombres" placeholder="Ej: Juan" />
                        <small class="text-red-500"
                            *ngIf="userForm.get('nombres')?.invalid && userForm.get('nombres')?.touched">Nombres son
                            requeridos.</small>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="primerApellido" class="font-medium">Primer Apellido</label>
                        <input pInputText id="primerApellido" formControlName="primerApellido"
                            placeholder="Ej: Pérez" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="segundoApellido" class="font-medium">Segundo Apellido</label>
                        <input pInputText id="segundoApellido" formControlName="segundoApellido"
                            placeholder="Ej: Rojas" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="email" class="font-medium">Correo Electrónico</label>
                        <input pInputText id="email" formControlName="email" placeholder="Ej: juan@cossmil.mil.bo" />
                        <small class="text-red-500"
                            *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">Email válido es
                            requerido.</small>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="rol" class="font-medium">Rol</label>
                        <select id="rol" formControlName="rol"
                            class="w-full p-2 border border-surface-300 dark:border-surface-600 rounded bg-surface-0 dark:bg-surface-900">
                            <option value="ADMIN">ADMINISTRADOR</option>
                            <option value="USER">USUARIO REGULAR</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="area" class="font-medium">Área</label>
                        <input pInputText id="area" formControlName="area" placeholder="Ej: Sistemas" />
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="reparticion" class="font-medium">Repartición</label>
                        <input pInputText id="reparticion" formControlName="reparticion"
                            placeholder="Ej: Dirección General" />
                    </div>
                </form>
            </div>
        </ng-template>

        <ng-template pTemplate="footer">
            <p-button label="Cancelar" icon="pi pi-times" [text]="true" (onClick)="displayDialog = false"></p-button>
            <p-button label="Guardar" icon="pi pi-check" (onClick)="saveUser()" [loading]="isSaving"
                [disabled]="isUploading"></p-button>
        </ng-template>
    </p-dialog>

    <!-- Componente global para confirmaciones -->
    <p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
    <p-toast></p-toast>
</div>
